services:

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SEUIL_SIMILARITE=${SEUIL_SIMILARITE:-0.35}
    volumes:
      - ./corpus:/app/corpus
    depends_on:
      - qdrant

volumes:
  qdrant_data: