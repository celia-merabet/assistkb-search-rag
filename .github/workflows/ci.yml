name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Vérifier la syntaxe des fichiers Python
        run: |
          python -m compileall app scripts

      - name: Vérifier que le JSON du golden dataset est valide
        run: |
          python -c "import json; json.load(open('eval/golden.json', encoding='utf-8')); print('golden.json valide')"